<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urcard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #fefcf5;
            --gold: #c5a572;
            --rose: #e6c5c5;
            --dark-rose: #d6a7a7;
            --dark-text: #5c4b37;
            --font-heading: 'Great Vibes', cursive;
            --font-body: 'Cormorant Garamond', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden; /* Prevent scrolling during transitions */
        }

        body {
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark-text);
            transition: background 0.8s ease-in-out;
        }

        .background-form {
            background: url('assets/images/vintage-paper-light.jpg') no-repeat center center/cover;
        }

        .background-card {
            background: url('assets/images/gold-glitter.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* --- Page Sections --- */
        .page-section {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease-in-out, visibility 0.6s;
            transform: translateY(20px);
        }

        .page-section.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* --- Form Section --- */
        .card-container {
            background: rgba(254, 252, 245, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(197, 165, 114, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        #form-section h1 {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            color: var(--dark-text);
            margin-bottom: 15px;
        }

        #form-section p {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.1rem;
            font-weight: 400;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1.2rem;
            background-color: var(--cream);
            transition: all 0.3s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(197, 165, 114, 0.4);
        }

        .styled-button {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--dark-text);
            background: transparent;
            border: 2px solid var(--gold);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .styled-button:hover {
            background: var(--gold);
            color: white;
            box-shadow: 0 5px 15px rgba(197, 165, 114, 0.5);
        }

        /* --- Share Section --- */
        #share-section h2 {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            margin-bottom: 20px;
        }
        
        #shareLinkContainer {
            background: var(--cream);
            border: 1px dashed var(--gold);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            width: 100%;
            text-align: center;
        }
        
        #shareLinkContainer p {
            font-size: 1.1rem;
            color: #777;
            margin-bottom: 10px;
        }
        
        #shareLink {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--dark-text);
            word-break: break-all;
        }
        
        #copyButton {
            margin-bottom: 15px;
        }
        #proceedButton {
            display: none; /* Initially hidden */
            background-color: var(--dark-rose);
            border-color: var(--dark-rose);
            color: white;
        }
        #proceedButton:hover {
             background: #c29292;
             border-color: #c29292;
        }

        /* NEW STYLE for the clickable link */
        #externalLink {
            display: none; /* Hide by default */
            margin-top: 15px;
            color: var(--dark-text);
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px dashed var(--dark-text);
            transition: color 0.3s;
            padding-bottom: 2px;
        }
        #externalLink:hover {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }
        
        .copy-success {
            opacity: 0;
            font-size: 1rem;
            color: var(--dark-rose);
            transition: opacity 0.5s;
        }
        .copy-success.visible { opacity: 1; }

        /* --- Card Section --- */
        #card-section .card-container {
             transform-style: preserve-3d;
        }

        /* Animate-in sequence for card elements */
        .animate-in {
            opacity: 0;
            transform: translateY(30px);
            animation: animateIn 0.8s ease-out forwards;
        }

        #headingDisplay { animation-delay: 0.5s; }
        .cake-container { animation-delay: 0.8s; }
        #nameDisplay { animation-delay: 1.1s; }
        .interaction-hint { animation-delay: 1.4s; }
        
        @keyframes animateIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        #headingDisplay { font-family: var(--font-heading); font-size: 4rem; margin-bottom: 15px; }
        #nameDisplay { font-size: 1.8rem; margin-bottom: 20px; font-weight: 400; }
        
        #messageDisplay {
            font-size: 1.4rem;
            line-height: 1.7;
            margin-top: 30px;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }
        #messageDisplay.visible { opacity: 1; }
        
        .interaction-hint { transition: opacity 0.5s; }
        .interaction-hint.hidden { opacity: 0; }
        
        /* --- Accurate Cake Design --- */
        .cake-container {
            position: relative;
            margin: 30px auto;
            width: 250px;
            height: 280px;
        }

        .cake-plate {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 115%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 50%;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 0 #ddd, 0 10px 15px rgba(0,0,0,0.2);
        }

        .cake {
            position: absolute;
            bottom: 40px; /* Sits on the plate */
            left: 50%;
            transform: translateX(-50%);
            width: 190px;
            height: 110px;
        }

        .icing { display: none; }
        
        .layer { /* Base styles for layers */
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            border-radius: 50% / 30px; /* Round the body */
        }

        .layer-bottom { bottom: 0; height: 100%; background: linear-gradient(to bottom, #e0b6b6, var(--dark-rose)); }
        .layer-bottom::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 100%; height: 60px; background-color: var(--dark-rose); border-radius: 50%; box-shadow: inset 0 -4px 5px rgba(0,0,0,0.2); }
        .layer-top { top: -5px; height: 70px; background: linear-gradient(to bottom, #f5d7d7, var(--rose)); width: 98%; }
        .layer-top::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 100%; height: 60px; background: var(--rose); border-radius: 50%; box-shadow: inset 0 -3px 4px rgba(0,0,0,0.15); }
        
        .drip { position: absolute; top: 30px; width: 22px; height: 45px; background: var(--rose); border-radius: 0 0 50% 50%; box-shadow: inset -2px -1px 3px rgba(0,0,0,0.1); }
        .drip1 { left: 10%;} .drip2 { left: 30%; height: 60px; } .drip3 { left: 55%; height: 50px; } .drip4 { left: 80%;}
       
        .candles { position: absolute; top: -55px; left: 50%; transform: translateX(-50%); width: 70%; display: flex; justify-content: space-around; }
        .candle { width: 8px; height: 55px; background: linear-gradient(to right, #fff, #f8f8f8); border-radius: 5px 5px 0 0; position: relative; box-shadow: -1px 0 3px rgba(0,0,0,0.1) inset; }
        .candle::before { content: ''; position: absolute; top: -4px; left: 50%; transform: translateX(-50%); width: 2px; height: 4px; background: #333; }

        .flame { position: absolute; top: -22px; left: 50%; transform-origin: 50% 100%; width: 14px; height: 22px; background-color: #ffde72; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation: flicker 1.2s ease-in-out infinite alternate; }
        .flame.out { animation: flameOut 0.4s ease-out forwards; }
        
        @keyframes flicker { 0% { transform: translateX(-50%) scaleY(1) skewX(0); opacity: 1; } 50% { transform: translateX(-55%) scaleY(1.1) skewX(5deg); opacity: 0.9; } 100% { transform: translateX(-50%) scaleY(1.05) skewX(-5deg); opacity: 1; } }
        @keyframes flameOut { from { opacity: 1; transform: translateX(-50%) scale(1); } to { opacity: 0; transform: translateX(-50%) scale(0) translateY(20px); } }

        /* --- Full Screen Transition Overlay --- */
        #transition-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: flex; pointer-events: none; }
        #transition-overlay .gate { flex: 1; background-color: var(--cream); transform: scaleX(0); transition: transform 0.8s cubic-bezier(0.86, 0, 0.07, 1); }
        #transition-overlay.in .gate { transform: scaleX(1); }
        #transition-overlay.out .gate { transform: scaleX(0); transition-delay: 0.2s; }
        #transition-overlay .gate:first-child { transform-origin: left; } #transition-overlay .gate:last-child { transform-origin: right; }
        #transition-overlay p { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; font-family: var(--font-heading); color: var(--dark-text); opacity: 0; transition: opacity 0.5s ease; }
        #transition-overlay.in p { opacity: 1; transition-delay: 0.5s; }

        /* --- Celebration Effects --- */
        #celebration-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 9999;
        }
        
        .balloon {
            position: absolute;
            bottom: -200px; /* Start below the screen */
            width: 70px;
            height: 90px;
            background-color: #ff5e57;
            border-radius: 50%;
            animation: flyUp 10s ease-in-out forwards;
        }
        .balloon::after { /* Balloon string */
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 100px;
            background-color: rgba(0,0,0,0.3);
        }

        @keyframes flyUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); }
            100% { 
                transform: translateY(-120vh) translateX(10vw) rotate(15deg); 
            }
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #feca57;
            opacity: 0;
            animation: confetti-fall 5s ease-out forwards;
        }
        
        @keyframes confetti-fall {
            0% { transform: translateY(-20vh) rotateZ(0deg); opacity: 1; }
            100% { transform: translateY(120vh) rotateZ(720deg); opacity: 0; }
        }

        /* --- Watermark --- */
        .watermark {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold);
            opacity: 0.8;
            font-size: 0.9rem;
            font-family: var(--font-body);
            letter-spacing: 1px;
            pointer-events: none; /* Make it non-interactive */
        }

        /* --- Responsive Design --- */
        @media (max-width: 600px) {
            #form-section h1, #share-section h2, #headingDisplay { font-size: 2.5rem; }
            .card-container { padding: 25px; }
            #nameDisplay { font-size: 1.4rem; }
            #messageDisplay { font-size: 1.1rem; }
            .cake-container { transform: scale(0.8); margin: 15px auto; }
            .balloon { width: 50px; height: 65px; } /* Smaller balloons on mobile */
        }
    </style>
</head>
<body class="background-form">

    <!-- Section 1: Input Form -->
    <section id="form-section" class="page-section">
        <div class="card-container">
            <h1>An Elegant Card</h1>
            <p>Fill the details below.</p>
            <form id="cardForm">
                <div class="input-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required placeholder="e.g., Krish">
                </div>
                <div class="input-group">
                    <label for="heading">Heading:</label>
                    <input type="text" id="heading" required placeholder="e.g., Happy Birthday!">
                </div>
                <div class="input-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" rows="4" required placeholder="May God Bless You..."></textarea>
                </div>
                <button type="submit" class="styled-button">Create Card</button>
            </form>
        </div>
        <!-- Watermark Added Here -->
        <div class="watermark">Made By KKC</div>
    </section>
    
    <!-- Section 2: Share Link Screen -->
    <section id="share-section" class="page-section">
        <div class="card-container">
            <h2>Your Card is Ready!</h2>
            <div id="shareLinkContainer">
                <p>Share this magical link with someone special:</p>
                <span id="shareLink"></span>
            </div>
            <button id="copyButton" class="styled-button">Copy Link 📋</button>
            <p class="copy-success">Copied to clipboard!</p>
            <button id="proceedButton" class="styled-button">Proceed to Card 💌</button>
            <!-- NEW clickable text link -->
            <a href="https://www.shorturl.at/" id="externalLink">Short URL Here!</a>
        </div>
    </section>
    
    <!-- Section 3: Final Card Display -->
    <section id="card-section" class="page-section">
        <div class="card-container">
            <h1 id="headingDisplay" class="animate-in"></h1>
            <div class="cake-container animate-in">
                <div class="cake-plate"></div>
                <div class="cake">
                    <div class="layer layer-bottom"></div>
                    <div class="layer layer-top"></div>
                    <div class="icing"></div>
                    <div class="drip drip1"></div>
                    <div class="drip drip2"></div>
                    <div class="drip drip3"></div>
                    <div class="drip drip4"></div>
                    <div class="candles">
                        <div class="candle"><div class="flame"></div></div>
                        <div class="candle"><div class="flame"></div></div>
                        <div class="candle"><div class="flame"></div></div>
                    </div>
                </div>
            </div>
            <p id="nameDisplay" class="animate-in"></p>
            <div class="interaction-hint animate-in">
                <p>Shake your phone!</p>
            </div>
            <p id="messageDisplay"></p>
        </div>
    </section>

    <!-- Utilities -->
    <div id="transition-overlay">
        <p id="transition-text"></p>
        <div class="gate"></div>
        <div class="gate"></div>
    </div>
    <audio id="backgroundMusic" loop><source src="assets/audio/background-music.mp3" type="audio/mpeg"></audio>
    <audio id="blowSound"><source src="assets/audio/blow-sound.mp3" type="audio/mpeg"></audio>
    <div id="celebration-container"></div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DOM Elements ---
        const sections = { form: document.getElementById('form-section'), share: document.getElementById('share-section'), card: document.getElementById('card-section') };
        const cardForm = document.getElementById('cardForm');
        const shareLinkEl = document.getElementById('shareLink');
        const copyButton = document.getElementById('copyButton');
        const proceedButton = document.getElementById('proceedButton');
        const externalLink = document.getElementById('externalLink');
        const transitionOverlay = document.getElementById('transition-overlay');
        const transitionText = document.getElementById('transition-text');
        const headingDisplay = document.getElementById('headingDisplay');
        const nameDisplay = document.getElementById('nameDisplay');
        const messageDisplay = document.getElementById('messageDisplay');
        const flames = document.querySelectorAll('.flame');
        const hint = document.querySelector('.interaction-hint');
        const backgroundMusic = document.getElementById('backgroundMusic');
        const blowSound = document.getElementById('blowSound');
        const celebrationContainer = document.getElementById('celebration-container');
        
        // --- State ---
        let currentCardData = {};
        let candlesBlownOut = false;
        let candleTimeoutId = null; 

        // --- Core Logic ---
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('name')) {
            currentCardData = { name: urlParams.get('name') || 'A friend', heading: urlParams.get('heading') || 'A Special Message', message: urlParams.get('message') || 'Wishing you all the best!' };
            runTransition('Unveiling your card...', () => showPage('card', true));
        } else {
            showPage('form');
        }

        cardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            currentCardData = { name: document.getElementById('name').value, heading: document.getElementById('heading').value, message: document.getElementById('message').value };
            runTransition('Creating your link...', () => {
                const queryParams = new URLSearchParams(currentCardData).toString();
                const newUrl = `${window.location.origin}${window.location.pathname}?${queryParams}`;
                history.pushState({}, '', newUrl);
                shareLinkEl.textContent = newUrl;
                showPage('share');
            });
        });

        copyButton.addEventListener('click', () => {
            navigator.clipboard.writeText(shareLinkEl.textContent).then(() => {
                const successMsg = document.querySelector('.copy-success');
                successMsg.classList.add('visible');
                copyButton.style.display = 'none';
                proceedButton.style.display = 'block';
                externalLink.style.display = 'inline-block';
                setTimeout(() => successMsg.classList.remove('visible'), 2000);
            });
        });

        proceedButton.addEventListener('click', () => {
            runTransition('Opening your card...', () => showPage('card', true));
        });

        // --- UI & Page Functions ---
        function runTransition(text, onMiddle) {
            transitionText.textContent = text;
            transitionOverlay.classList.add('in');
            setTimeout(() => {
                onMiddle();
                transitionOverlay.classList.remove('in');
                transitionOverlay.classList.add('out');
                setTimeout(() => {
                    transitionOverlay.classList.remove('out');
                    transitionText.textContent = '';
                }, 1000); 
            }, 1000); 
        }
        
        function showPage(pageKey, runCardSetup = false) {
            Object.values(sections).forEach(s => s.classList.remove('active'));
            sections[pageKey].classList.add('active');
            if (pageKey === 'card') {
                document.body.className = 'background-card';
                populateCard(currentCardData);
                if (runCardSetup) initializeCardInteractivity();
            } else {
                document.body.className = 'background-form';
            }
        }

        function populateCard(data) {
            headingDisplay.textContent = data.heading;
            nameDisplay.textContent = data.name;
            messageDisplay.textContent = data.message;
        }

        function handleFirstInteraction() {
            backgroundMusic.play();
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState !== 'granted') {
                            console.warn('Permission for device motion was not granted.');
                        }
                    })
                    .catch(console.error);
            }
        }

        // --- Interactive Card Functions ---
        function initializeCardInteractivity() {
            candlesBlownOut = false;
            flames.forEach(f => f.classList.remove('out'));
            messageDisplay.classList.remove('visible');
            hint.classList.remove('hidden');
            if (candleTimeoutId) clearTimeout(candleTimeoutId);
            celebrationContainer.innerHTML = '';

            backgroundMusic.currentTime = 0;
            backgroundMusic.play().catch(() => {
                document.body.addEventListener('click', handleFirstInteraction, { once: true });
            });
            
            setupShakeDetection();
            candleTimeoutId = setTimeout(blowOutCandles, 120000); 
        }
        
        function blowOutCandles() {
            if (candleTimeoutId) clearTimeout(candleTimeoutId);
            if (candlesBlownOut) return;
            candlesBlownOut = true;
            hint.classList.add('hidden');
            blowSound.play();
            flames.forEach(flame => flame.classList.add('out'));

            setTimeout(() => {
                messageDisplay.classList.add('visible');
                window.removeEventListener('devicemotion', handleMotion);
                startCelebration(); 
            }, 800);
        }

        // --- MODIFIED SHAKE DETECTION LOGIC (Less Sensitive) ---
        function handleMotion(event) {
            if (candlesBlownOut) return;
            if (!event.accelerationIncludingGravity.x) { return; }

            const a = event.accelerationIncludingGravity;
            const now = Date.now();

            if ((now - handleMotion.lastUpdate) < 100) {
                return;
            }

            const diffTime = now - handleMotion.lastUpdate;
            handleMotion.lastUpdate = now;

            const speed = Math.abs(a.x + a.y + a.z - handleMotion.last_x - handleMotion.last_y - handleMotion.last_z) / diffTime * 10000;
            
            // --- ADJUST THESE VALUES to change sensitivity ---
            // SHAKE_THRESHOLD: How strong a single shake must be. HIGHER = less sensitive (requires a rougher shake).
            const SHAKE_THRESHOLD = 450; 
            // REQUIRED_SHAKES: How many strong shakes are needed in a row.
            const REQUIRED_SHAKES = 2;
            // SHAKE_TIMEOUT: The maximum time (in ms) between shakes to be counted as a sequence. SHORTER = more rapid shaking needed.
            const SHAKE_TIMEOUT = 500;

            if (speed > SHAKE_THRESHOLD) {
                if ((now - handleMotion.lastShakeTime) > SHAKE_TIMEOUT) {
                    handleMotion.shakeCount = 1;
                } else {
                    handleMotion.shakeCount++;
                }
                
                handleMotion.lastShakeTime = now;

                if (handleMotion.shakeCount >= REQUIRED_SHAKES) {
                    blowOutCandles();
                }
            }
            
            handleMotion.last_x = a.x;
            handleMotion.last_y = a.y;
            handleMotion.last_z = a.z;
        }

        // Initialize state variables on the function itself to avoid global scope pollution
        handleMotion.lastUpdate = 0;
        handleMotion.last_x = 0;
        handleMotion.last_y = 0;
        handleMotion.last_z = 0;
        handleMotion.shakeCount = 0;
        handleMotion.lastShakeTime = 0;

        function setupShakeDetection() {
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', handleMotion);
            }
        }

        // --- Celebration Logic ---
        function startCelebration() {
            const colors = ['#ff5e57', '#48dbfb', '#fffa65', '#34e7e4', '#55e6c1'];

            for(let i=0; i<8; i++){
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.left = `${Math.random() * 80 + 10}vw`;
                balloon.style.animationDelay = `${Math.random() * 2}s`;
                balloon.style.animationDuration = `${Math.random() * 5 + 8}s`;
                celebrationContainer.appendChild(balloon);
            }

            for(let i=0; i<100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.animationDelay = `${Math.random() * 3}s`;
                confetti.style.animationDuration = `${Math.random() * 3 + 4}s`;
                celebrationContainer.appendChild(confetti);
            }
        }
    });
    </script>
</body>
</html>
